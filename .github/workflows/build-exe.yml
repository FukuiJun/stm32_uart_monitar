name: Build exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "作成するリリースのタグ (例: v1.0.2)。空欄ならビルドのみ"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # タグ push 時はそのタグ、手動実行時は入力されたタグでリリースする
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check source
        id: src
        shell: pwsh
        run: |
          if (Test-Path uart_monitar_gui.py) {
            "found=true" >> $env:GITHUB_OUTPUT
          } else {
            "found=false" >> $env:GITHUB_OUTPUT
            Write-Output "::notice::uart_monitar_gui.py is not in the repository yet; skipping build."
          }

      - uses: actions/setup-python@v5
        if: steps.src.outputs.found == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.src.outputs.found == 'true'
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        if: steps.src.outputs.found == 'true'
        run: pyinstaller --noconfirm --windowed --onedir --name UartMonitor --icon assets/icon.ico --add-data "assets/icon.ico;assets" --collect-data customtkinter uart_monitar_gui.py

      - name: Smoke test (window opens, icon size)
        if: steps.src.outputs.found == 'true'
        run: |
          pip install pillow
          python .github/scripts/smoke_test_exe.py dist/UartMonitor/UartMonitor.exe

      - name: Add usage guide
        if: steps.src.outputs.found == 'true'
        shell: pwsh
        run: Copy-Item packaging/*.txt dist/UartMonitor/

      # Artifact はダウンロード時に GitHub が zip 化するので、フォルダをそのまま上げる
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.found == 'true'
        with:
          name: UartMonitor
          path: dist/UartMonitor

      - name: Package zip for release
        if: steps.src.outputs.found == 'true' && startsWith(env.RELEASE_TAG, 'v')
        shell: pwsh
        run: Compress-Archive -Path dist/UartMonitor -DestinationPath UartMonitor.zip

      # タグが未作成なら、ビルドしたコミットにタグを作成してリリースする
      - uses: softprops/action-gh-release@v2
        if: steps.src.outputs.found == 'true' && startsWith(env.RELEASE_TAG, 'v')
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: UartMonitor.zip
